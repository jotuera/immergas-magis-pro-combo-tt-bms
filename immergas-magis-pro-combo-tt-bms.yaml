# Immergas Magis Pro / Combo - T-/T+ BMS Modbus master (ESPHome, M5Stack Atom + RS485)
#
# Reads and controls the Immergas Magis Pro / Combo V2 heat pump over the T-/T+ BMS port (Modbus RTU,
# slave 11, 9600 8N2): operating mode, flow/return/DHW temperatures, heat pump data, boiler faults,
# integration and installer settings, estimated gas use. No cloud. See README.md for wiring and the register map.
#
# Project : jotuera.immergas-magis-pro-combo-tt-bms  |  v2.3.0
# Repo    : https://github.com/jotuera/immergas-magis-pro-combo-tt-bms
# License : MIT (c) 2026 JoTu
# Tested  : Magis Combo 9 Plus V2 (fw 6.0), Magis Pro V2 (community).
#
# This file is all you copy into ESPHome. The code lives in packages/*.yaml of the repo and is fetched from
# GitHub (packages: below). Remove a line to drop a feature; tt_core, tt_status and tt_circuit are always needed
# (tt_gas also needs them). Language: pick ONE file from packages/lang/ (tt_en, tt_pl).
# Any name or text can be overridden in substitutions: below, e.g.  n_tt_d06_oat: "Immergas - Outside".
#
# File and id names start with tt_, so this repo can run on the same device as the D+/D- (dd-modbus) and
# F1/F2 (f1f2-nasa) projects later: list their packages next to these ones and keep one device section.

substitutions:
  device_name: immergas-tt-atom          # hostname, max 31 characters
  friendly_name: Immergas T-T+ Atom
  # RS485 pins - change only if your wiring differs from M5Stack Atom + RS485 unit:
  # tt_uart_tx_pin: GPIO26
  # tt_uart_rx_pin: GPIO32
  # tt_uart_de_pin: GPIO25

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.9.0

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uses DHCP by default. Uncomment and adjust for a static IP:
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  ap:
    ssid: "Immergas T-T+ Atom Fallback"
    password: !secret fallback_ap_password

captive_portal:

binary_sensor:
  - platform: status
    name: "${n_tt_esphome_status}"
    entity_category: diagnostic

button:
  - platform: restart
    name: "${n_tt_restart}"
    entity_category: config

# The T-/T+ code, downloaded from GitHub. Change "ref" to upgrade (or "main" for the development version).
packages:
  tt_bms:
    url: https://github.com/jotuera/immergas-magis-pro-combo-tt-bms
    ref: v2.3.0
    refresh: 1d
    files:
      - packages/tt_core.yaml          # UART, Modbus, polling, "BMS connection" switch   (required)
      - packages/tt_status.yaml        # mode, D97/D98/D99, faults, A11, D61, D91, clock  (required)
      - packages/tt_circuit.yaml       # D20/D08/D06/D04/D14, boiler flow, 3-way valve     (required)
      - packages/tt_heat_pump.yaml     # D24, D71-D77, compressor power step
      - packages/tt_dhw.yaml           # D03, DHW water_heater, T02, DHW boost
      - packages/tt_heating.yaml       # R01, R04/R05/R12/R13, zone 1 thermostat enable
      - packages/tt_integration.yaml   # menu I (gas/heat pump integration)
      - packages/tt_installer.yaml     # P15, A12, A03/A04, T04, T05
      - packages/tt_computed.yaml      # Delta T, thermal power, lift, ...
      - packages/tt_gas.yaml           # estimated gas consumption (Energy dashboard)
      - packages/tt_diagnostics.yaml   # undecoded registers (diagnostic)
      # - packages/tt_scanner.yaml     # optional: active PDU scanner (for decoding new registers)
      - packages/lang/tt_en.yaml       # language of entity names and texts: tt_en | tt_pl

globals:
  - id: tt_pdu_scanner_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: tt_pdu_scan_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: tt_pdu_scan_waiting
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: tt_pdu_scan_start
    type: int
    restore_value: no
    initial_value: '0'
  - id: tt_pdu_scan_end
    type: int
    restore_value: no
    initial_value: '0'
  - id: tt_pdu_scan_current
    type: int
    restore_value: no
    initial_value: '0'
  - id: tt_pdu_scan_last_sent
    type: int
    restore_value: no
    initial_value: '0'
  - id: tt_pdu_scan_found_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: tt_pdu_scan_sent_at_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: tt_pdu_scan_func
    type: uint8_t
    restore_value: no
    initial_value: '0x03'

script:
  - id: tt_start_pdu_scan
    mode: restart
    then:
      - lambda: |-
          if (!id(tt_pdu_scanner_mode)) {
            id(tt_pdu_scan_status).publish_state("Turn on scanner mode first");
            ESP_LOGW("T_PDU_SCAN", "START ignored - scanner mode OFF");
            return;
          }
          id(tt_bms).stop_poller();
          id(tt_bms_diag).stop_poller();
          id(tt_pdu_scan_active) = true;
          id(tt_pdu_scan_waiting) = false;
          id(tt_pdu_scan_current) = id(tt_pdu_scan_start);
          id(tt_pdu_scan_found_count) = 0;
          id(tt_pdu_scan_current_sensor).publish_state(id(tt_pdu_scan_current));
          id(tt_pdu_scan_found_sensor).publish_state(0);
          char msg[120];
          snprintf(msg, sizeof(msg), "Scan: PDU %d-%d, function 0x%02X", id(tt_pdu_scan_start), id(tt_pdu_scan_end), id(tt_pdu_scan_func));
          id(tt_pdu_scan_status).publish_state(msg);
          id(tt_pdu_scan_last_result).publish_state("Waiting for first response...");
          ESP_LOGI("T_PDU_SCAN", "START range=%d-%d", id(tt_pdu_scan_start), id(tt_pdu_scan_end));
  - id: tt_stop_pdu_scan
    mode: restart
    then:
      - lambda: |-
          id(tt_pdu_scan_active) = false;
          id(tt_pdu_scan_waiting) = false;
          id(tt_pdu_scan_status).publish_state("Scan stopped");
          ESP_LOGI("T_PDU_SCAN", "STOP current=%d found=%d", id(tt_pdu_scan_current), id(tt_pdu_scan_found_count));

interval:
  - interval: 160ms
    then:
      - lambda: |-
          if (!id(tt_pdu_scanner_mode) || !id(tt_pdu_scan_active)) { return; }
          if (id(tt_pdu_scan_current) > id(tt_pdu_scan_end)) {
            id(tt_pdu_scan_active) = false;
            id(tt_pdu_scan_waiting) = false;
            char done[140];
            snprintf(done, sizeof(done), "Done: PDU %d-%d, found %d", id(tt_pdu_scan_start), id(tt_pdu_scan_end), id(tt_pdu_scan_found_count));
            id(tt_pdu_scan_status).publish_state(done);
            ESP_LOGI("T_PDU_SCAN", "DONE range=%d-%d found=%d", id(tt_pdu_scan_start), id(tt_pdu_scan_end), id(tt_pdu_scan_found_count));
            return;
          }
          uint32_t now = millis();
          if (id(tt_pdu_scan_waiting)) {
            if ((uint32_t)(now - id(tt_pdu_scan_sent_at_ms)) > 600) {
              id(tt_pdu_scan_waiting) = false;
              id(tt_pdu_scan_current) = id(tt_pdu_scan_last_sent) + 1;
              id(tt_pdu_scan_current_sensor).publish_state(id(tt_pdu_scan_current));
            }
            return;
          }
          int reg = id(tt_pdu_scan_current);
          id(tt_pdu_scan_last_sent) = reg;
          id(tt_pdu_scan_sent_at_ms) = now;
          id(tt_pdu_scan_waiting) = true;
          id(tt_modbus).queue_pdu(0x0B,
              modbus::helpers::create_client_pdu((modbus::FunctionCode) id(tt_pdu_scan_func), (uint16_t) reg, 1));

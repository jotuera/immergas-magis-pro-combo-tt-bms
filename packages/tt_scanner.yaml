# Immergas Magis Pro / Combo T-/T+ BMS - package "tt_scanner"
# Active PDU scanner (optional). Turn on "scanner mode" (pauses normal polling), pick a range, results go to the log.
# Part of jotuera/immergas-magis-pro-combo-tt-bms (MIT). Loaded by the main YAML through `packages:`.
# File and id names start with tt_ so this repo can be combined with the D+/D- and F1/F2 repos on one device.

uart:
  - id: !extend tt_uart
    # Debug RX - used ONLY by the PDU scanner (beta). Logs nothing during normal operation.
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        timeout: 30ms
      sequence:
        - lambda: |-
            if (!id(tt_pdu_scan_active)) { return; }
            if (direction != esphome::uart::UART_DIRECTION_RX) { return; }
            if (bytes.size() < 5) { return; }
            if (bytes[0] != 0x0B) { return; }
            int reg = id(tt_pdu_scan_last_sent);
            char msg[160];
            if ((bytes[1] == 0x03 || bytes[1] == 0x04) && bytes.size() >= 7 && bytes[2] == 0x02) {
              uint16_t value = ((uint16_t) bytes[3] << 8) | bytes[4];
              id(tt_pdu_scan_found_count) += 1;
              snprintf(msg, sizeof(msg), "OK PDU %d = %u (F%02X)", reg, value, bytes[1]);
              id(tt_pdu_scan_last_result).publish_state(msg);
              id(tt_pdu_scan_found_sensor).publish_state(id(tt_pdu_scan_found_count));
              ESP_LOGI("T_PDU_SCAN", "OK pdu=%d value=%u", reg, value);
              id(tt_pdu_scan_waiting) = false;
              id(tt_pdu_scan_current) = reg + 1;
              id(tt_pdu_scan_current_sensor).publish_state(id(tt_pdu_scan_current));
              return;
            }
            if ((bytes[1] == 0x83 || bytes[1] == 0x84) && bytes.size() >= 5) {
              if (bytes[2] != 0x02) {
                snprintf(msg, sizeof(msg), "EXCEPTION PDU %d code %u", reg, bytes[2]);
                id(tt_pdu_scan_last_result).publish_state(msg);
                ESP_LOGW("T_PDU_SCAN", "EXCEPTION pdu=%d code=%u", reg, bytes[2]);
              }
              id(tt_pdu_scan_waiting) = false;
              id(tt_pdu_scan_current) = reg + 1;
              id(tt_pdu_scan_current_sensor).publish_state(id(tt_pdu_scan_current));
              return;
            }

sensor:
  - platform: template
    name: "${n_tt_pdu_scan_current_sensor}"
    id: tt_pdu_scan_current_sensor
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "${n_tt_pdu_scan_found_sensor}"
    id: tt_pdu_scan_found_sensor
    accuracy_decimals: 0
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: "${n_tt_pdu_scan_status}"
    id: tt_pdu_scan_status
    entity_category: diagnostic

  - platform: template
    name: "${n_tt_pdu_scan_last_result}"
    id: tt_pdu_scan_last_result
    entity_category: diagnostic

switch:
  - platform: template
    name: "${n_tt_pdu_scanner_mode_switch}"
    id: tt_pdu_scanner_mode_switch
    icon: mdi:radar
    entity_category: config
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(tt_pdu_scanner_mode) = true;
          id(tt_pdu_scan_active) = false;
          id(tt_pdu_scan_waiting) = false;
          id(tt_bms).stop_poller();
          id(tt_bms_diag).stop_poller();
          id(tt_pdu_scan_status).publish_state("Scanner mode ON - polling paused");
          ESP_LOGW("T_PDU_SCAN", "SCANNER MODE ON - pollers stopped");
    turn_off_action:
      - lambda: |-
          id(tt_pdu_scanner_mode) = false;
          id(tt_pdu_scan_active) = false;
          id(tt_pdu_scan_waiting) = false;
          id(tt_bms).start_poller();
          id(tt_bms_diag).start_poller();
          id(tt_pdu_scan_status).publish_state("Normal mode - polling resumed");
          ESP_LOGI("T_PDU_SCAN", "SCANNER MODE OFF - pollers started");

  - platform: template
    name: "${n_tt_pdu_scan_input_func_switch}"
    id: tt_pdu_scan_input_func_switch
    icon: mdi:swap-horizontal
    entity_category: config
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(tt_pdu_scan_func) = 0x04;
          id(tt_pdu_scan_status).publish_state("Scanner: Input Registers (0x04)");
    turn_off_action:
      - lambda: |-
          id(tt_pdu_scan_func) = 0x03;
          id(tt_pdu_scan_status).publish_state("Scanner: Holding Registers (0x03)");


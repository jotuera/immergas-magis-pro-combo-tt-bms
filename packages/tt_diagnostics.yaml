# Immergas Magis Pro / Combo T-/T+ BMS - package "tt_diagnostics"
# Undecoded registers (raw, diagnostic) and the undocumented writable 0/1 registers - help decoding them.
# Part of jotuera/immergas-magis-pro-combo-tt-bms (MIT). Loaded by the main YAML through `packages:`.
# File and id names start with tt_ so this repo can be combined with the D+/D- and F1/F2 repos on one device.

sensor:
  - platform: modbus_controller
    modbus_controller_id: tt_bms_diag
    name: "${n_tt_pdu_512}"
    id: tt_pdu_512
    register_type: holding
    address: 512
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0

  # Candidate: 1 = heat pump excluded / heating by boiler only (seen once, I10 = 35 test).
  - platform: modbus_controller
    modbus_controller_id: tt_bms_diag
    name: "${n_tt_pdu_3027}"
    id: tt_pdu_3027
    register_type: holding
    address: 3027
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: tt_bms_diag
    name: "${n_tt_pdu_3061}"
    id: tt_pdu_3061
    register_type: holding
    address: 3061
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: tt_bms_diag
    name: "${n_tt_pdu_4201}"
    id: tt_pdu_4201
    register_type: holding
    address: 4201
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0

  # 4452 - constant (25.1 here, 23.6 on another unit) -> a setting, not a refrigerant temperature. Meaning unknown.
  - platform: modbus_controller
    modbus_controller_id: tt_bms_diag
    name: "${n_tt_pdu_4452}"
    id: tt_pdu_4452
    entity_category: diagnostic
    register_type: holding
    address: 4452
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      # -32768 (0x8000) = probe not fitted on this unit -> report "unknown" instead of -3276.8
      - lambda: |-
          return x == -32768 ? NAN : x * 0.1f;

  - platform: modbus_controller
    modbus_controller_id: tt_bms_diag
    name: "${n_tt_pdu_4588}"
    id: tt_pdu_4588
    register_type: holding
    address: 4588
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: tt_bms_diag
    name: "${n_tt_pdu_6002}"
    id: tt_pdu_6002
    register_type: holding
    address: 6002
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0

  # A03/A04 (pump min/max %) removed from diagnostics — available as number sliders.

  - platform: modbus_controller
    modbus_controller_id: tt_bms_diag
    name: "${n_tt_pdu_6014}"
    id: tt_pdu_6014
    register_type: holding
    address: 6014
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: tt_bms_diag
    name: "${n_tt_pdu_6503}"
    id: tt_pdu_6503
    register_type: holding
    address: 6503
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: tt_bms_diag
    name: "${n_tt_pdu_6504}"
    id: tt_pdu_6504
    register_type: holding
    address: 6504
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0

switch:
  - platform: modbus_controller
    modbus_controller_id: tt_bms
    name: "${n_tt_sw_2102}"
    id: tt_sw_2102
    register_type: holding
    address: 2102
    bitmask: 1
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: tt_bms
    name: "${n_tt_sw_4449}"
    id: tt_sw_4449
    register_type: holding
    address: 4449
    bitmask: 1
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: tt_bms
    name: "${n_tt_sw_4600}"
    id: tt_sw_4600
    register_type: holding
    address: 4600
    bitmask: 1
    entity_category: config

  # boiler fault descriptions (C++ cases of the "Boiler fault (description)" lambda)
  l_tt_fault_cases: |-
    case 0: t = "SYSTEM OK. System działający prawidłowo -> Nie jest wymagana żadna czynność"; break;
    case 1: t = "Blokada - brak zapłonu. Nie wykryto płomienia po zakończeniu ostatniej próby włączenia -> Należy nacisnąć na przycisk resetowania."; break;
    case 2: t = "Blokada termostatu bezpieczeństwa (nadmierna temperatura).. Ingerencja termostatu bezpieczeństwa -> Należy nacisnąć na przycisk resetowania."; break;
    case 3: t = "Blokada termostatu spalin. Ingerencja termostatu dymu -> Należy nacisnąć na przycisk resetowania. (wersje Nike)/Skonfigurować prawidłowo parametr P.14. W razie konieczności nacisnąć przycisk Reset (wersja Star)"; break;
    case 4: t = "Blokada oporu styków. Wykryto nieprawidłowość na obwodzie sterującym zaworem gazu -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 5: t = "Nieprawidłowość sondy odpływu. Sonda wyjścia c.o. wykazuje wartość rezystancji poza zakresem -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 6: t = "Nieprawidłowość sondy w.u.. Sonda c.w.u. wykazuje wartość rezystancji poza zakresem -> W tym przypadku kocioł wytwarza c.w.u., lecz nie w warunkach maksymalnych osiągów. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 8: t = "Maksymalna liczba resetów. Wskazuje na osiągnięcie maksymalnej liczby resetów dozwolonych przez elektroniczną płytę główną -> Uwaga: nieprawidłowość można zresetować 5 razy z rzędu, następnie funkcja zostaje zablokowana na przynajmniej godzinę i zyskuje się jedną próbę co godzinę dla maksymalnie 5 prób. Odłączając i włączając zasilanie urządzenia, zyskuje się ponownie 5 prób."; break;
    case 10: t = "Niewystarczające ciśnienie w instalacji. Styk presostatu c.o. jest otwarty -> Należy sprawdzić na manometrze kotła, czy ciśnienie instalacji zawiera się między 1÷1,2 bara, i ewentualnie przywrócić prawidłowe ciśnienie."; break;
    case 11: t = "Nieprawidłowość presostatu spalin. Możliwe nieprawidłowości w presostacie spalin lub w wentylatorze -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 12: t = "Nieprawidłowość sondy zasobnika c.w.u.. Sonda zasobnika c.w.u. wykazuje wartość rezystancji poza zakresem -> Kocioł nie może wytworzyć c.w.u. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 13: t = "Miernik natężenia przepływu powietrza/spalin poza zakresem. Sygnał powietrze/spaliny jest poza zakresem lub przy wyłączonym wentylatorze urządzenie kontrolne odczytuje zbyt wysoki sygnał -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 15: t = "Błąd konfiguracji. Karta wykrywa niezgodność między swoją konfiguracją a sygnałami na wejściu -> W razie przywrócenia normalnego stanu, kocioł uruchamia się bez konieczności wyzerowania go. Sprawdzić, czy kocioł jest skonfigurowany prawidłowo. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 16: t = "Nieprawidłowość wentylatora. Wentylator obraca się, gdy nie jest zasilany, lub nie obraca się, gdy jest zasilany -> Należy nacisnąć na przycisk resetowania. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 17: t = "Nieprawidłowa prędkość wentylatora. Liczba obrotów wentylatora przekracza prawidłowy zakres -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 20: t = "Blokada - niepożądany płomień. Wykrycie nieprawidłowego płomienia -> Należy nacisnąć na przycisk resetowania. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 23: t = "Nieprawidłowość sondy powrotu. Sondy powrotu wykazuje wartość rezystancji poza zakresem -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 24: t = "Nieprawidłowość tablicy przyciskowej. Wykryto stały nacisk na przyciskach na tablicy sterowania -> W razie przywrócenia normalnego stanu, kocioł uruchamia się bez konieczności wyzerowania go. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 25: t = "Blokada sondy spalin / blokada CRC (TERA). Temperatura spalin poza zakresem / uszkodzona pamięć (TERA) -> Wcisnąć przycisk Reset"; break;
    case 27: t = "Niewystarczająca cyrkulacja. Przegrzanie kotła w wyniku słabej cyrkulacji w obwodzie pierwotnym -> Nacisnąć na przycisk Reset"; break;
    case 28: t = "Przeciek obwodu w.u.. Jeśli podczas pracy w fazie ogrzewania pojawi się podwyższenie temperatury w.u., kocioł wskazuje nieprawidłowość i redukuje temperaturę ogrzewania, aby ograniczyć tworzenie się osadów wapiennych w wymienniku. -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 29: t = "Nieprawidłowość sondy spalin. Sonda spalin wykazuje wartość rezystancji poza zakresem -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 31: t = "Utrata komunikacji z CARV2. Brak komunikacji między kartą a zdalnym sterowaniem. -> Należy odłączyć i ponownie włączyć napięcie kotła. Jeśli nawet przy ponownym włączeniu nie zostanie wykryte zdalne sterowanie, kocioł przechodzi do pracy lokalnej, korzystając ze sterowania obecnego na panelu sterowania. W tym przypadku nie można włączyć funkcji „Ogrzewanie”."; break;
    case 32: t = "Nieprawidłowość sondy 2. strefy niskiej temperatury. Sonda wyjścia c.o. 2. strefy poza zakresem -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 33: t = "Nieprawidłowość sondy 3. strefy niskiej temperatury. Sonda wyjścia c.o. 3. strefy poza zakresem -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 36: t = "Utrata połączenia IMG Bus. Utrata połączenia na protokole IMG Bus. -> Kocioł nie spełnia wymagań c.o."; break;
    case 37: t = "Niskie ciśnienie zasilania. Napięcie zasilania karty jest niższe od dopuszczalnych limitów. -> W razie przywrócenia normalnego stanu, kocioł uruchamia się bez konieczności wyzerowania go."; break;
    case 38: t = "Utrata sygnału płomienia. Karta po osiągnięciu prawidłowej wartości prądu jonizacji odnotowuje jego spadek. -> W razie przywrócenia normalnego stanu, kocioł uruchamia się bez konieczności wyzerowania go."; break;
    case 39: t = "Nieprawidłowość sondy kolektora słonecznego. Sonda zewnętrzna wykazuje wartość rezystancji poza zakresem -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 40: t = "Nieprawidłowość sondy zasobnika słonecznego. Sonda zasobnika słonecznego wykazuje wartość rezystancji poza zakresem -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 41: t = "Wysoka temperatura na kolektorze słonecznym. Kolektor słoneczny przekroczył maksymalną ustawioną temperaturę -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 42: t = "Wysoka temperatura na zasobniku słonecznym. Zasobnik słoneczny przekroczył maksymalną ustawioną temperaturę -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 43: t = "Blokada z powodu utraty sygnału płomienia. Utrata sygnału płomienia pracy kilka razy z rzędu. -> Należy nacisnąć na przycisk resetowania. Przed ponownym uruchomieniem kocioł wykona cykl post-wentylacji."; break;
    case 44: t = "Blokada z powodu przekroczenia maksymalnego całkowitego czasu częstego otwierania zaworu gazu. Całkowity czas otwierania zaworu gazu bez wykrycia płomienia jest większy niż dopuszczalny czas maksymalny. -> Należy nacisnąć na przycisk resetowania."; break;
    case 45: t = "duża ΔT. Różnica temperatury zmierzonej między wyjściem a powrotem wynosi ≥ di 40°C. -> Moc palnika jest zmniejszana, aby zapobiec ewentualnemu uszkodzeniu modułu kondensacyjnego; po przywróceniu prawidłowej ΔT kocioł wraca do normalnego funkcjonowania. Należy sprawdzić, czy w instalacji krąży woda, czy pompa obiegowa jest skonfigurowana zgodnie z wymaganiami instalacji oraz czy sonda powrotu funkcjonuje prawidłowo."; break;
    case 46: t = "Interwencja termostatu niskiej temperatury (opcja) / Błędna konfiguracja okablowania/karty. Termostat bezpieczeństwa znajdujący się na połączeniu odpływu z kotła z DIM v2 (działający jedynie w niskiej temperaturze) osiągnął wysoką temperaturę. / Błąd okablowania lub błędne użycie karty zamiennej -> W takim przypadku po ochłodzeniu można zresetować termostat (patrz odpowiedni arkusz instrukcji). / Jeśli zablokowanie lub nieprawidłowość utrzymuje się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 47: t = "Ograniczenie mocy palnika. Jeżeli temperatura spalin osiągnie wysoką wartość, karta zmniejszy moc przekazywaną do palnika w celu ograniczenia szkód w obwodzie spalin. -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 48: t = "Nieprawidłowość sondy wyjścia c.o. od strony instalacji. Sonda wyjścia c.o. od strony instalacji wykazuje wartość rezystancji poza zakresem -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 49: t = "Blokada wysokiej temperatury na sondzie po stronie powrotnej. Sonda powrotu zmierzyła wysoką temperaturę -> Sprawdzić, czy obieg w kotle oraz funkcjonowanie zaworu trójdrożnego są prawidłowe."; break;
    case 50: t = "Nieprawidłowość sondy zewnętrznej. Sonda zewnętrzna wykazuje wartość rezystancji poza zakresem -> Sprawdzić podłączenie sondy zewnętrznej. Instalacja kontynuuje pracę"; break;
    case 51: t = "Utrata połączenia z CAR Wireless. Połączenie między podstawą nadawczą a CAR v2 RF zostało utracone. -> Sprawdzić działanie CAR Wireless, sprawdzić poziom naładowania baterii (patrz oddzielna instrukcja obsługi)."; break;
    case 54: t = "Nieprawidłowość sondy puffer. Sonda puffer wykazuje wartość rezystancji poza zakresem -> Tryb puffer zostanie wyłączony"; break;
    case 55: t = "Nieprawidłowość sondy temperatury wyjścia c.o. 1. strefy. Sonda wyjścia c.o. 1. strefy wykazuje wartość rezystancji poza zakresem -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 58: t = "Nieprawidłowość Audax. Sygnalizacja nieprawidłowości przez podłączoną do instalacji pompę ciepła AUDAX -> Pompa ciepła nie spełnia wymagań ogrzewania i chłodzenia pomieszczenia, po przywróceniu połączeń należy wyłączyć i ponownie uruchomić instalację"; break;
    case 59: t = "Blokada częstotliwości sieci zasilania elektrycznego. Karta elektryczna wykryła nieprawidłową częstotliwość sieci zasilania elektrycznego. -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 60: t = "Nieprawidłowość pompy obiegowej. Pompa modulująca nie pracuje. -> Podjąć próbę odblokowania pompy obiegowej zgodnie ze wskazówkami w odpowiednim paragrafie. W razie przywrócenia normalnego stanu, kocioł uruchamia się bez konieczności wyzerowania go."; break;
    case 61: t = "Obecność powietrza w pompie obiegowej. Pompa modulująca nie pracuje na skutek wykrycia powietrza. -> Odpowietrzyć pompę obiegową oraz obwód grzewczy. W razie przywrócenia normalnego stanu, kocioł uruchamia się bez konieczności wyzerowania go."; break;
    case 62: t = "Żądanie pełnej kalibracji. Karta nie posiada prawidłowej konfiguracji parametrów kontroli spalania. -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 63: t = "Nieprawidłowość sondy powrotu instalacji. Sonda powrotu wykazuje wartość rezystancji poza zakresem -> Kocioł kontynuuje pracę bez żadnej integracji ze strony podłączonych instalacji zewnętrznych"; break;
    case 67: t = "Nieprawidłowość presostatu instalacji słonecznej. Otwarty presostat instalacji, możliwy brak cieczy -> Sprawdzić na manometrze zespołu pompowego instalacji słonecznej, czy ciśnienie ma prawidłową wartość"; break;
    case 70: t = "Sondy odwrócone. W przypadku błędu w połączeniu okablowania kotła, wykrywany jest błąd -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 72: t = "Żądanie szybkiej kalibracji. Karta nie posiada prawidłowej konfiguracji niektórych parametrów kontroli spalania. -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 73: t = "Wykryte wysokie odchylenie sondy wyjścia c.o. i sondy wyjścia bezpieczeństwa c.o.. Sondy wyjścia wykazują wysokie odchylenie. -> W razie przywrócenia normalnego stanu kocioł uruchamia się bez konieczności jego wyzerowania"; break;
    case 74: t = "Nieprawidłowość sondy wyjścia bezpieczeństwa c.o.. Sonda wyjścia bezpieczeństwa c.o. wykazuje wartość rezystancji poza zakresem. -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 75: t = "Blokada w wyniku uszkodzonego czujnika NTC. Możliwe uszkodzenie jednej lub obydwu sond przepływu i powrotu instalacji -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 76: t = "Rozgałęzienie sondy przepływu lub sondy powrotu. Wykryto nieprawidłowe działanie jednej lub obydwu sond przepływu i powrotu instalacji -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 77: t = "Nieprawidłowość kontroli spalania. Wykryto prąd na zaworze gazu poza zakresem. -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 78: t = "Nieprawidłowość kontroli spalania. Wykryto wysoki prąd na zaworze gazu. -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 79: t = "Nieprawidłowość kontroli spalania. Wykryto niski prąd na zaworze gazu. -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 80: t = "Blokada z powodu awarii karty elektronicznej. Wykryto usterkę na sterowniku elektronicznego zaworu gazu w wyniku problemów na karcie lub zaworze gazu. -> Należy nacisnąć na przycisk resetowania."; break;
    case 84: t = "Nieprawidłowość spalania – trwa zmniejszanie mocy. Wykryto warunki porównywalne do niskiego ciśnienia zasilania zaworu gazu. -> W razie przywrócenia normalnego stanu kocioł uruchamia się bez konieczności jego wyzerowania"; break;
    case 85: t = "Blokada – problem z dopalaniem. Potencjalny problem z zaworem gazu, elektrodą lub kartą elektroniczną. -> Należy nacisnąć na przycisk resetowania. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)"; break;
    case 87: t = "Blokada kontroli zaworu gazu. Wykryto usterkę kontroli zaworu gazu. -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 88: t = "Blokada kontroli zaworu gazu. Wykryto usterkę kontroli zaworu gazu. -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 89: t = "Sygnał niestabilnego spalania. Wykryto niestabilny sygnał spalania. -> Kocioł kontynuuje pracę."; break;
    case 90: t = "Sygnał spalania poza zakresem. Wykryto sygnał spalania poza zakresem. -> Kocioł kontynuuje pracę."; break;
    case 91: t = "Blokada z powodu nieprawidłowego zapłonu. Karta wyczerpała wszystkie możliwe działania celem posiadania optymalnego zapłonu palnika. -> Należy nacisnąć na przycisk resetowania."; break;
    case 92: t = "Limit korekcji obrotów wentylatora. Karta osiągnęła maksymalną liczbę korekcji obrotów wentylatora. -> Kocioł kontynuuje pracę."; break;
    case 93: t = "Sygnał spalania poza zakresem. Wykryto sygnał spalania poza zakresem. -> Kocioł kontynuuje pracę."; break;
    case 94: t = "Nieprawidłowość spalania. Wykryto błąd w spalaniu spowodowany systemem lub kontrolą spalania. -> W razie przywrócenia normalnego stanu, kocioł uruchamia się bez konieczności wyzerowania go."; break;
    case 95: t = "Sygnał nieciągły spalania. Wykryto brak ciągłości sygnału spalania na skutek problemów z połączeniami elektrycznymi lub rozszczepienia sygnału. -> Kocioł kontynuuje pracę."; break;
    case 96: t = "Zatkany układ powietrzno-spalinowy. Wykryto zatkanie układu powietrzno-spalinowego. -> Kocioł nie uruchamia się. Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 98: t = "Blokada wskutek maks. liczby błędów oprogramowania. Karta elektroniczna nie działa prawidłowo. -> Należy nacisnąć na przycisk resetowania."; break;
    case 99: t = "Blokada ogólna. Karta elektroniczna nie działa prawidłowo. -> Należy nacisnąć na przycisk resetowania."; break;
    case 101: t = "Alarm pompa Audax jest niedostępna. Utrata połączenia z pompą ciepła -> Pompa ciepła nie spełnia wymagań ogrzewania i chłodzenia pomieszczenia, po przywróceniu połączeń należy wyłączyć i ponownie uruchomić instalację"; break;
    case 102: t = "Alarm zbiornik wyrównawczy 1. strefy jest niedostępny. Utrata połączenia ze zbiornikiem wyrównawczym 1. strefy -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 103: t = "Alarm zbiornik wyrównawczy 2. strefy jest niedostępny. Utrata połączenia ze zbiornikiem wyrównawczym 2. strefy -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 104: t = "Alarm zbiornik wyrównawczy 3. strefy jest niedostępny. Utrata połączenia ze zbiornikiem wyrównawczym 3. strefy -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 106: t = "Alarm sondy c.w.u.. W przypadku wbudowania kotła i oddzielnego zarządzania ciepłą wodą użytkową, czujnik zasobnika c.w.u. kontrolowany przez administratora wykazuje wartość rezystancji poza zakresem -> Instalacja nie może produkować ciepłej wody użytkowej przy użyciu pompy ciepła. Wytwarzanie ciepłej wody użytkowej zapewniane jest przez kocioł"; break;
    case 120: t = "Alarm wysokiej nastawy dla osuszania 1 strefy. Obliczona nastawa wymagana przez 1. strefę jest zbyt wysoka w celu osuszenia -> Obliczona nastawa po stronie tłocznej przekracza dopuszczalną górną granicę osuszacza. Schłodzić pomieszczenie i zaczekać, aż punkt rosy powróci do dopuszczalnych wartości"; break;
    case 121: t = "Alarm urządzenie 1. strefy jest niedostępne. Zdalne sterowanie lub zdalna kontrola 1. strefą jest niedostępne -> Sprawdzić, czy zdalne sterowanie jest włączone"; break;
    case 122: t = "Alarm urządzenie 2. strefy jest niedostępne. Zdalne sterowanie lub zdalna kontrola 2. strefą jest niedostępne -> Sprawdzić, czy zdalne sterowanie jest włączone"; break;
    case 123: t = "Alarm urządzenie 3. strefy jest niedostępne. Zdalne sterowanie lub zdalna kontrola 3. strefą jest niedostępne -> Sprawdzić, czy zdalne sterowanie jest włączone"; break;
    case 125: t = "Nieprawidłowość czujnika temperatury otoczenia 1. strefy. Sonda temperatury otoczenia 1. strefy jest poza zakresem -> Oprócz temperatury, nie jest obliczany punkt rosy dla strefy"; break;
    case 126: t = "Nieprawidłowość czujnika temperatury otoczenia 2. strefy. Sonda temperatury otoczenia 2. strefy jest poza zakresem -> Oprócz temperatury, nie jest obliczany punkt rosy dla strefy"; break;
    case 127: t = "Nieprawidłowość czujnika temperatury otoczenia 3. strefy. Sonda temperatury otoczenia 3. strefy jest poza zakresem -> Oprócz temperatury, nie jest obliczany punkt rosy dla strefy"; break;
    case 129: t = "Nieprawidłowość sondy wilgotności 1. strefy. Sonda temperatury wilgotności 1. strefy jest poza zakresem -> Oprócz wilgotności, nie jest obliczany punkt rosy dla strefy"; break;
    case 130: t = "Nieprawidłowość sondy wilgotności 2. strefy. Sonda temperatury wilgotności 2. strefy jest poza zakresem -> Oprócz wilgotności, nie jest obliczany punkt rosy dla strefy"; break;
    case 131: t = "Nieprawidłowość sondy wilgotności 3. strefy. Sonda temperatury wilgotności 3. strefy jest poza zakresem -> Oprócz wilgotności, nie jest obliczany punkt rosy dla strefy"; break;
    case 132: t = "Alarm wysokiej nastawy dla osuszania 2. strefy. Obliczona nastawa wymagana przez 2. strefę jest zbyt wysoka w celu osuszenia -> Obliczona nastawa po stronie tłocznej przekracza dopuszczalną górną granicę osuszacza. Schłodzić pomieszczenie i zaczekać, aż punkt rosy powróci do dopuszczalnych wartości"; break;
    case 133: t = "Alarm uszkodzenia osuszacza 1. strefy. Osuszacz 1. strefy jest w stanie alarmu -> Instalacja nie wykonuje osuszania w danej strefie"; break;
    case 134: t = "Alarm uszkodzenia osuszacza 2. strefy. Osuszacz 2. strefy jest w stanie alarmu -> Instalacja nie wykonuje osuszania w danej strefie"; break;
    case 135: t = "Alarm uszkodzenia osuszacza 3. strefy. Osuszacz 3. strefy jest w stanie alarmowym -> Instalacja nie wykonuje osuszania w danej strefie"; break;
    case 137: t = "Alarm przywrócenia instalacji - Ponownie uruchomić instalację. Po operacji przywrócenia wykonanej za pomocą panelu sterowania, wyświetli się alarm w związku z koniecznością ponownego uruchomienia instalacji -> Wyłączyć i ponownie uruchomić instalację"; break;
    case 138: t = "Wygrzewanie jastrychu w toku. Funkcja wygrzewania jastrychu w toku"; break;
    case 139: t = "Odpowietrzanie w toku. Funkcja odpowietrzania w toku"; break;
    case 177: t = "Alarm maksymalnego czasu c.w.u.. Żądanie ciepłej wody użytkowej zostało wykonane z przekroczeniem maksymalnego ustalonego czasu -> Instalacja kontynuuje pracę z nieoptymalną wydajnością"; break;
    case 178: t = "Cykl antylegionella nie powiódł się. Cykl antylegionella nie zakończył się powodzeniem w ustalonym czasie -> Wcisnąć przycisk Reset"; break;
    case 179: t = "Nieprawidłowość sondy fazy ciekłej. Sonda fazy ciekłej jest poza zakresem. -> Instalacja nie uruchamia się. Wezwać autoryzowaną firmę (np. Serwis Techniczny Immergas)."; break;
    case 181: t = "Utrata połączenia ze zdalnym sterowaniem 2. strefy. Brak komunikacji między kartą a zdalnym sterowaniem 2. strefy. -> Należy odłączyć i ponownie włączyć moduł hydroniczny. Jeśli nawet przy ponownym włączeniu nie zostanie wykryte zdalne sterowanie, instalacja przechodzi do pracy lokalnej korzystając z poleceń obecnych na panelu sterowania. W tym przypadku nie można włączyć funkcji “Ogrzewanie”"; break;
    case 182: t = "Alarm skraplarki. Występuje błąd skraplarki -> Instalacja nie działa, patrz nieprawidłowe działanie skraplarki i odpowiednią instrukcję obsługi"; break;
    case 183: t = "Alarm skraplarki w trybie testmode. Skraplarka znajduje się w trybie TESTMODE -> W tej fazie nie jest możliwe spełnienie żądań klimatyzacji pomieszczeń i produkcji ciepłej wody użytkowej."; break;
    case 184: t = "Alarm limitu czasu połączenia z jednostką zewnętrzną=. Utrata połączenia ze skraplarką -> Polecić sprawdzenie połączenia elektrycznego między urządzeniami"; break;
    case 185: t = "Alarm połączenia modułu bezpieczeństwa. Utrata połączenia z modułem bezpieczeństwa -> Polecić sprawdzenie połączenia pomiędzy komponentami"; break;
    case 186: t = "Nieprawidłowość wysokiego napięcia modułu zapłonowego. Moduł bezpieczeństwa: wystąpiła nieprawidłowość napięcia modułu zapłonowego -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 187: t = "Alarm sondy powrotu skraplarki. Czujnik powrotu skraplarki jest poza zakresem -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 188: t = "Żądanie poza zakresem działania. Żądanie nie może zostać wykonane, ponieważ warunki zewnętrzne nie pozwalają na włączenie skraplarki -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 189: t = "Alarm limitu czasu połączenia z płytą komunikacyjną. Utrata połączenia z płytą komunikacyjną skraplarki -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 191: t = "Utrata połączenia RF w kierunku CAR v2 RF 2.strefy. Połączenie między podstawą nadawczą a CAR v2 RF 2.strefy zostało utracone -> Sprawdzić działanie CAR Wireless, sprawdzić poziom naładowania baterii (patrz oddzielna instrukcja obsługi)."; break;
    case 192: t = "Nieprawidłowość sondy wyjścia c.o. skraplarki. Sonda wyjścia c.o. skraplarki jest poza zakresem -> Gdy blokada lub nieprawidłowość wydłuża się, należy wezwać autoryzowaną firmę (na przykład Serwis Techniczny Immergas)."; break;
    case 193: t = "Urządzenie w trybie Testmode. Urządzenie sterowane jest przez urządzenie zewnętrzne z użyciem protokołu Opentherm -> Instalacja kontynuuje prawidłową pracę"; break;
    case 194: t = "Audax Pro jest wyłączona. Skraplarka Audax Pro została wyłączona -> Instalacja kontynuuje prawidłową pracę"; break;
    case 195: t = "Nieprawidłowość niskiej temp. w fazie ciekłej. Temp. sondy fazy ciekłej jest za niska -> Sprawdzić prawidłowe działanie obwodu chłodniczego"; break;
    case 196: t = "Blokada wysoka temp. zasilania. Wykryto zbyt wysoką temperaturę obwodu powrotnego pompy ciepła. -> Sprawdzić prawidłowe działanie obwodu chłodniczego"; break;
    default: t = "Nieprawidłowość ogólna nierozpoznana"; break;

